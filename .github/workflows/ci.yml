name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Lint and formatting
        run: |
          ruff check antismash_review tests
          ruff format --check antismash_review tests
      - name: Type checking
        run: |
          mypy antismash_review
      - name: Run tests with pytest
        run: |
          pytest --cov=antismash_review --cov-report=term-missing --cov-fail-under=90
      - name: Build and packaging smoke test
        run: |
          python -m pip install build
          python -m build
          python -m venv /tmp/antismash-review-wheeltest
          /tmp/antismash-review-wheeltest/bin/python -m pip install --upgrade pip
          /tmp/antismash-review-wheeltest/bin/python -m pip install dist/*.whl
          /tmp/antismash-review-wheeltest/bin/python -m pip check
          cd /tmp
          /tmp/antismash-review-wheeltest/bin/antismash-review --help
          /tmp/antismash-review-wheeltest/bin/python -c "
          import antismash_review
          from pathlib import Path
          print(f'Version: {antismash_review.__version__}')
          pkg_path = Path(antismash_review.__file__).resolve()
          print(f'Import path: {pkg_path}')
          assert 'antismash-review-wheeltest' in str(pkg_path), f'Shadowed: {pkg_path}'
          "

